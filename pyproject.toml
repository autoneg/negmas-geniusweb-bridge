[project]
name = "negmas-geniusweb-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yasser Mohammad", email = "yasserfarouk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["negmas",
"geniuswebcore @ https://tracinsy.ewi.tudelft.nl/pubtrac/GeniusWebPython/export/100/geniuswebcore/dist/geniusweb-1.2.1.tar.gz",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.uv.sources]
negmas = { git = "https://github.com/yasserfarouk/negmas", branch = "master" }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
